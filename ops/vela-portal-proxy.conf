# Include inside the EXISTING defivela.xyz proxy location, alongside its
# Host, X-Forwarded-Proto and WebSocket headers. Never send this secret to clients.
# The private include is generated from the existing backend proxy environment.
include /root/Vera/.runtime/lighter-showcase/nginx-portal-auth.conf;
proxy_set_header X-Vela-Public-Origin https://defivela.xyz;
proxy_set_header X-Vela-Client-IP $remote_addr;
