name: Vela backend validation

on:
  push:
    branches: [main]
    paths:
      - deployments/multichain/**
      - .github/workflows/vela-backend.yml
  pull_request:
    paths:
      - deployments/multichain/**
      - .github/workflows/vela-backend.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deployments/multichain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned backend requirements
        run: python -m pip install -r requirements.txt
      - name: Verify backend and deployment guards with isolated fixtures
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest
          tests/test_completion_safety.py tests/test_agent_sessions.py
          tests/test_model_usage.py tests/test_model_concurrency.py tests/test_runtime_errors.py
          tests/test_staking.py tests/test_staking_api.py tests/test_paper_desk.py
          tests/test_trading_details.py tests/test_backend_acceptance.py
          tests/test_backend_release.py tests/test_source_preservation.py
          tests/test_backend_deployment.py
          -q
      - name: Check installed dependency consistency
        run: python -m pip check
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deployments/multichain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned advisory scanner
        run: python -m pip install pip-audit==2.10.1
      - name: Audit backend dependencies against current advisories
        run: python -m pip_audit -r requirements.txt --progress-spinner off

  product-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deployments/multichain/site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install locked product dependencies without lifecycle scripts
        run: npm ci --prefix products-toolchain --ignore-scripts --no-audit --no-fund
      - name: Audit the scoped product toolchain
        run: npm audit --prefix products-toolchain --audit-level=low
      - name: Reproduce scoped product bundles and DogeOS copy update
        run: |
          npm run build:products
          python3 scripts/prepare-dogeos-portal.py --source deployed-simple-tabs
          git diff --exit-code -- products-built portal-built

  judge-quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deployments/multichain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run the documented judge setup from a fresh checkout
        run: bash tools/setup_judge_demo.sh
      - name: Check actual dashboard assets, API, long/short fills and partial closes
        env:
          PYTHONPATH: backend
        run: .venv/bin/python -m pytest tests/test_judge_demo.py tests/test_paper_acceptance.py tests/test_persistent_trading.py -q
      - name: Rehearse the complete loan, AI pipeline and settlement with explicit fixtures
        run: .venv/bin/python tools/rehearse.py

