[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
fs_permissions = [{ access = "read-write", path = "../config" }]

[fuzz]
runs = 256
