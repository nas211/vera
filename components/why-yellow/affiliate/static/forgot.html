<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>WHY Affiliate · Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080b;--card:#0f1117;--line:#1f2330;--ink:#e8eaf0;--dim:#8b90a0;--y:#f5c400;--red:#ff5d5d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--dim);margin:0 0 24px;font-size:14px}
label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
input{width:100%;background:#0a0c12;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px 14px;font:inherit}
input:focus{outline:none;border-color:var(--y)}
button{width:100%;margin-top:22px;background:var(--y);color:#111;border:0;border-radius:10px;padding:13px;font:600 15px Inter,sans-serif;cursor:pointer}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}.info{color:#3ddc84;font-size:13px;min-height:0}.foot{text-align:center;font-size:13px;margin:18px 0 0}.foot a{color:var(--dim)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;font-weight:700}.brand i{width:12px;height:12px;border-radius:50%;background:var(--y);display:inline-block}
</style></head><body>
<form class="card" method="post" action="{{PREFIX}}/forgot">
  <div class="brand"><i></i>WHY Trading Bot · Affiliate CRM</div>
  <h1>Reset your password</h1><p class="sub">Enter the email of your team or partner login. We email you a link that works once, for 60 minutes.</p>
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required autofocus>
  <div class="err">{{ERROR}}</div>
  <div class="info">{{INFO}}</div>
  <button type="submit">Email me a reset link</button>
  <p class="foot"><a href="{{PREFIX}}/login">Back to sign in</a></p>
</form>
</body></html>
